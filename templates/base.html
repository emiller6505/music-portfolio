<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Ethan Miller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-gray-900 hover:text-gray-700 transition">
                        Portfolio
                    </a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="/" class="text-gray-700 hover:text-gray-900 transition">Home</a>
                    <a href="/blog/" class="text-gray-700 hover:text-gray-900 transition">Blog</a>
                    <a href="/projects.html" class="text-gray-700 hover:text-gray-900 transition">Projects</a>
                    <a href="mailto:string.slinger@outlook.com" class="text-gray-700 hover:text-gray-900 transition">Email</a>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-gray-700 hover:text-gray-900">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="mobile-menu" class="hidden md:hidden pb-4">
                <a href="/" class="block py-2 text-gray-700 hover:text-gray-900">Home</a>
                <a href="/blog/" class="block py-2 text-gray-700 hover:text-gray-900">Blog</a>
                <a href="/projects.html" class="block py-2 text-gray-700 hover:text-gray-900">Projects</a>
                <a href="mailto:string.slinger@outlook.com" class="block py-2 text-gray-700 hover:text-gray-900">Email</a>
            </div>
        </div>
    </nav>

    <main>
        {{content}}
    </main>

    <footer class="bg-gray-800 text-white mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center">
                <p class="text-gray-400">&copy; {{year}} Ethan Miller. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
